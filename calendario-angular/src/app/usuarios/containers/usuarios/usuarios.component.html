<mat-card>
  <mat-toolbar color="primary">Usuários do sistema

    <div class="campo-pesquisa">

      <mat-form-field class="input-pesquisa-usuario">
        <mat-label>Pesquise pelo Nome do usuário</mat-label>
        <mat-select (selectionChange)="onSearchTermChange($event.value)">

          <input class="input-pesquisa" (input)="filterSelectDeUsuarios($event)"
                 placeholder="Digite ou selecione para filtrar"/>
          <mat-option [value]="">
            Nenhum
          </mat-option>
          @for (usuario of usuarios; track usuario) {
            <mat-option [value]="usuario.username">
              {{ usuario.username }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

  </mat-toolbar>

  <div class="mat-elevation-z8">
      @if (usuarios$ | async; as usuarios) {
      <app-usuarios-lista
        [usuarios]="usuarios.pessoas"
        (add)="onAdd()"
        (edit)="onEdit($event)"
        (delete)="onRemove($event)"
      ></app-usuarios-lista>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 15]"
        showFirstLastButtons
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [length]="usuarios.totalElements"
        (page)="refresh($event)"
        aria-label="Selecione a página de usuarios">
      </mat-paginator>


  } @else {
    <div class="loading-spinner">
      <mat-spinner></mat-spinner>
    </div>
  }

  <ng-template #loading>
    <div class="loading-spinner">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>
</div>
</mat-card>
