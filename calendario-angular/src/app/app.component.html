<mat-toolbar class="mat-elevation-z3" color="primary">

  <mat-toolbar-row>
    <button *ngIf="isLoggedIn" class="button-menu"  mat-icon-button (click)="opened=!opened"><mat-icon>menu</mat-icon></button>



    <span class="logo-container">
      <img class="logo-logout" src="assets/image/decex-logo.png" alt="DECEx">
      <span class="logo-text">
        Departamento de Educação e Cultura do Exército
      </span>
    </span>



      <button *ngIf="isLoggedIn" class="button-logout"  mat-icon-button (click)="logout()"><mat-icon>logout</mat-icon></button>
  </mat-toolbar-row>

</mat-toolbar>

<mat-sidenav-container >
  <mat-sidenav *ngIf="isLoggedIn"  [(opened)]="opened" mode="side" [style.width]="'370px'">
    <app-custom-sidenav/>


  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
