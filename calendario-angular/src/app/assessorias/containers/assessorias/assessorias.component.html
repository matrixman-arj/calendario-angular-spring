<mat-card>
  <mat-toolbar color="primary">Assessorias do DECEx </mat-toolbar>
  <div class="mat-elevation-z8">
    @if (assessorias$ | async; as assessorias) {
      <app-assessorias-lista
        [assessorias]="assessorias"
        (add)="onAdd()"
        (edit)="onEdit($event)"
        (delete)="onRemove($event)"
      ></app-assessorias-lista>
    } @else {
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    }

    <ng-template #loading>
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    </ng-template>
  </div>
</mat-card>
