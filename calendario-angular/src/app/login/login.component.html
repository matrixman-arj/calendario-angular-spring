<mat-card>
  <div class="container">
    <div class="row">
      <div class="col-4"></div>
      <div class="col-4">
        <div class="card">
          <div class="card-body">


              <h3 class="card-title">Entre com seu Usuário e Senha:</h3><br>

              <div class="form-group">
                <label class="form-label" for="form1">Usuário:   </label>
                  <input type="text" name="username" class="form-control" [(ngModel)]="login.username" />
                </div>
                <br>
                <div class="form-group">
                  <label class="form-label" for="form1">Senha:   </label>
                  <input (keyup.enter)="logar()" type="password" name="senha" class="form-control" [(ngModel)]="login.password" />
                </div>
                <br>
              <button type="button" (click)="logar()" class="btn-rounded btn btn-primary">Logar</button>
          </div>
        </div>
      </div>
      <div class="col-4"></div>
    </div>
  </div>
</mat-card>
