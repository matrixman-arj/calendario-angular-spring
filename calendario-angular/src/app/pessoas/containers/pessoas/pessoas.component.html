<mat-card>
  <mat-toolbar color="primary">Ramais do DECEx </mat-toolbar>

  <mat-form-field appearance="fill">
    <mat-label>Pesquisar</mat-label>
    <input matInput (keyup)="onSearchTermChange($event)"  placeholder="Digite o termo">
  </mat-form-field>

  <div class="mat-elevation-z8">
      @if (pessoas$ | async; as pessoas) {
      <app-pessoas-lista
        [pessoas]="pessoas.pessoas"
        (add)="onAdd()"
        (edit)="onEdit($event)"
        (delete)="onRemove($event)"
      ></app-pessoas-lista>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 15]"
        showFirstLastButtons
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [length]="pessoas.totalElements"
        (page)="refresh($event)"
        aria-label="Selecione a página de pessoas">
      </mat-paginator>


  } @else {
    <div class="loading-spinner">
      <mat-spinner></mat-spinner>
    </div>
  }

  <ng-template #loading>
    <div class="loading-spinner">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>
</div>
</mat-card>
