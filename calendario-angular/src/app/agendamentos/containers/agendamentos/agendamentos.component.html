<mat-card>
  <mat-toolbar color="primary">Agendamentos para o Auditório do DECEx </mat-toolbar>
  <div class="mat-elevation-z8">
    @if (agendamentos$ | async; as agendamentos) {
      <app-agendamentos-lista
        [agendamentos]="agendamentos"
        (add)="onAdd()"
        (edit)="onEdit($event)"
        (delete)="onRemove($event)"
      ></app-agendamentos-lista>
    } @else {
      <div class="loading-spinner">
      </div>
    }

    <ng-template #loading>
      <div class="loading-spinner">

      </div>
    </ng-template>
  </div>
</mat-card>
